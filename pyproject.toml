# =============================================================================
# Medieval Village Simulation - Project metadata & tooling configuration
# =============================================================================

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "medieval-village-simulation"
version = "0.1.0"
description = "A modular, agent-based Medieval Village Simulation built on Mesa."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OsirisJr16" }]
keywords = ["mesa", "multi-agent-system", "simulation", "pygame", "medieval"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Intended Audience :: Developers",
]

# Runtime dependencies (kept in sync with requirements.txt).
dependencies = [
    "mesa>=3.1,<4.0",
    "pygame>=2.6,<3.0",
    "numpy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.0",
]

[project.urls]
Homepage = "https://example.com/medieval-village-simulation"
Repository = "https://example.com/medieval-village-simulation"

[project.scripts]
# Convenience entry point once the engine is implemented.
medieval-village = "main:main"

# -----------------------------------------------------------------------------
# Packaging (flat layout: each top-level domain package is discovered directly)
# -----------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "core*",
    "world*",
    "agents*",
    "ai*",
    "communication*",
    "economy*",
    "buildings*",
    "rendering*",
    "simulation*",
    "mde*",
]
exclude = ["tests*", "docs*", "assets*"]

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]  # Prefer D211 / D212 docstring conventions.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true  # Mesa / Pygame ship partial type stubs.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
